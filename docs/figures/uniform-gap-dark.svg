<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">The uniform gap</title>
<desc id="figdesc">spec H(g) is contained in {0} union [gamma, infinity) with one gamma for the whole cutoff class, so the gap does not close as the cutoff grows.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
       fill:#1f2328}
  .mut{fill:#6e7781} .sm{font-size:11px} .xs{font-size:9.5px} .b{font-weight:600}
  .ax{stroke:#d0d7de;stroke-width:1;fill:none}
  .gr{stroke:#d0d7de;stroke-width:.5;fill:none;opacity:.6}
</style>
<rect width="720" height="300" fill="#0d1117"/>
<text x="58.00" y="80.00" class="sm mut" text-anchor="end">g₁</text>
<line x1="70.00" y1="76.00" x2="680.00" y2="76.00" class="gr"/>
<circle cx="70.00" cy="76.00" r="4.50" fill="#4493f8"/>
<rect x="232.67" y="69.00" width="447.33" height="14.00" fill="#0c2d6b" rx="2"/>
<line x1="232.67" y1="69.00" x2="232.67" y2="83.00" class="" stroke="#3fb950" stroke-width="2"/>
<text x="58.00" y="124.00" class="sm mut" text-anchor="end">g₂</text>
<line x1="70.00" y1="120.00" x2="680.00" y2="120.00" class="gr"/>
<circle cx="70.00" cy="120.00" r="4.50" fill="#4493f8"/>
<rect x="232.67" y="113.00" width="447.33" height="14.00" fill="#0c2d6b" rx="2"/>
<line x1="232.67" y1="113.00" x2="232.67" y2="127.00" class="" stroke="#3fb950" stroke-width="2"/>
<text x="58.00" y="168.00" class="sm mut" text-anchor="end">g₃</text>
<line x1="70.00" y1="164.00" x2="680.00" y2="164.00" class="gr"/>
<circle cx="70.00" cy="164.00" r="4.50" fill="#4493f8"/>
<rect x="232.67" y="157.00" width="447.33" height="14.00" fill="#0c2d6b" rx="2"/>
<line x1="232.67" y1="157.00" x2="232.67" y2="171.00" class="" stroke="#3fb950" stroke-width="2"/>
<text x="58.00" y="212.00" class="sm mut" text-anchor="end">g₄</text>
<line x1="70.00" y1="208.00" x2="680.00" y2="208.00" class="gr"/>
<circle cx="70.00" cy="208.00" r="4.50" fill="#4493f8"/>
<rect x="232.67" y="201.00" width="447.33" height="14.00" fill="#0c2d6b" rx="2"/>
<line x1="232.67" y1="201.00" x2="232.67" y2="215.00" class="" stroke="#3fb950" stroke-width="2"/>
<line x1="232.67" y1="60.00" x2="232.67" y2="230.00" class="" stroke="#3fb950" stroke-width="1" stroke-dasharray="4 3"/>
<text x="232.67" y="54.00" class="b" text-anchor="middle" fill="#3fb950">γ</text>
<text x="70.00" y="54.00" class="b" text-anchor="middle" fill="#4493f8">0</text>
<text x="70.00" y="24.00" class="b">spec H(g) ⊆ {0} ∪ [γ, ∞), one γ for the whole class</text>
<text x="680.00" y="24.00" class="mut sm" text-anchor="end">Theorem 7.8</text>
<text x="70.00" y="274.00" class="mut sm">The ground state is simple and the gap is bounded below uniformly in the cutoff.</text>
<text x="70.00" y="290.00" class="mut sm">Lemma 9.1 turns that one number into a time kernel that decays faster than every polynomial.</text>
</svg>
